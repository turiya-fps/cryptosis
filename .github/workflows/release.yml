name: release

# Tag push (v*) → test → GoReleaser build → cosign keyless signature over
# checksums.txt → GitHub build-provenance attestations for every archive.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release, upload assets
      id-token: write # OIDC token for cosign + attestation signing
      attestations: write # store attestations
      artifact-metadata: write # attestation storage records
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog needs previous tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch release; the exact version is embedded in each binary
          # (`go version -m`) for anyone reproducing the build.
          go-version: stable
          cache: false # no cache restore into a release build
      - run: gpg --version | head -1
      - run: go test ./...
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
